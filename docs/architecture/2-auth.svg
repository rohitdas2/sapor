<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8402b"/></marker></defs><rect width="1200" height="640" fill="#fffdf9"/><text x="28" y="44" font-size="24" font-weight="700" fill="#2a2118">Sign-up, sign-in and sessions</text><rect x="40" y="90" width="330" height="200" rx="14" fill="#eef4f8" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="118" font-size="16" font-weight="700" fill="#2a2118">Sign up</text><text x="56" y="142" font-size="13.5" fill="#6b5a48">email (case-insensitive, unique)</text><text x="56" y="162" font-size="13.5" fill="#6b5a48">password ≥ 8 chars</text><text x="56" y="182" font-size="13.5" fill="#6b5a48">display name</text><text x="56" y="202" font-size="13.5" fill="#6b5a48">→ users + profiles rows in</text><text x="56" y="222" font-size="13.5" fill="#6b5a48">   one transaction</text><rect x="435" y="90" width="330" height="200" rx="14" fill="#fcefe8" stroke="#d9c9b0" stroke-width="1.5"/><text x="451" y="118" font-size="16" font-weight="700" fill="#2a2118">Hash (password.ts)</text><text x="451" y="142" font-size="13.5" fill="#6b5a48">salt = 16 random bytes (hex)</text><text x="451" y="162" font-size="13.5" fill="#6b5a48">digest = scrypt(pw, salt)</text><text x="451" y="182" font-size="13.5" fill="#6b5a48">   N=16384, r=8, p=1, 64 bytes</text><text x="451" y="202" font-size="13.5" fill="#6b5a48">store:</text><text x="451" y="222" font-size="13.5" fill="#6b5a48">scrypt:16384:8:1$salt$hex</text><rect x="830" y="90" width="330" height="200" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="846" y="118" font-size="16" font-weight="700" fill="#2a2118">Session</text><text x="846" y="142" font-size="13.5" fill="#6b5a48">token = 32 random bytes</text><text x="846" y="162" font-size="13.5" fill="#6b5a48">DB keeps sha256(token) only</text><text x="846" y="182" font-size="13.5" fill="#6b5a48">cookie sapor_session:</text><text x="846" y="202" font-size="13.5" fill="#6b5a48">   httpOnly, SameSite=Lax,</text><text x="846" y="222" font-size="13.5" fill="#6b5a48">   Secure in production, 30 days</text><line x1="370" y1="190" x2="435" y2="190" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><line x1="765" y1="190" x2="830" y2="190" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="340" width="330" height="200" rx="14" fill="#eef4f8" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="368" font-size="16" font-weight="700" fill="#2a2118">Sign in</text><text x="56" y="392" font-size="13.5" fill="#6b5a48">look up user by email</text><text x="56" y="412" font-size="13.5" fill="#6b5a48">unknown email → verify against</text><text x="56" y="432" font-size="13.5" fill="#6b5a48">   a dummy hash (same timing)</text><text x="56" y="452" font-size="13.5" fill="#6b5a48">5 failures / 10 min → 429</text><rect x="435" y="340" width="330" height="200" rx="14" fill="#fcefe8" stroke="#d9c9b0" stroke-width="1.5"/><text x="451" y="368" font-size="16" font-weight="700" fill="#2a2118">Verify</text><text x="451" y="392" font-size="13.5" fill="#6b5a48">split stored value on $</text><text x="451" y="412" font-size="13.5" fill="#6b5a48">re-run algorithm with salt +</text><text x="451" y="432" font-size="13.5" fill="#6b5a48">   candidate password</text><text x="451" y="452" font-size="13.5" fill="#6b5a48">timingSafeEqual(digest, stored)</text><text x="451" y="472" font-size="13.5" fill="#6b5a48">old params → re-hash on login</text><rect x="830" y="340" width="330" height="200" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="846" y="368" font-size="16" font-weight="700" fill="#2a2118">Every request</text><text x="846" y="392" font-size="13.5" fill="#6b5a48">getViewer(): cookie → sha256 →</text><text x="846" y="412" font-size="13.5" fill="#6b5a48">   sessions ⋈ users, not expired</text><text x="846" y="432" font-size="13.5" fill="#6b5a48">null = anonymous (read-only)</text><text x="846" y="452" font-size="13.5" fill="#6b5a48">requireViewer() on all writes → 401</text><text x="846" y="472" font-size="13.5" fill="#6b5a48">sign out deletes the session row</text><line x1="370" y1="440" x2="435" y2="440" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><line x1="765" y1="440" x2="830" y2="440" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><text x="40" y="590" font-size="14" fill="#2a2118" font-weight="400">Why scrypt instead of a single SHA-512 round: scrypt is deliberately slow and memory-hard, so a leaked table can&#x27;t be brute-forced at GPU speed.</text><text x="40" y="612" font-size="14" fill="#2a2118" font-weight="400">The algorithm field carries the cost parameters, so they can be raised later without breaking existing passwords.</text></svg>