<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8402b"/></marker></defs><rect width="1200" height="760" fill="#fffdf9"/><text x="28" y="44" font-size="24" font-weight="700" fill="#2a2118">Sapor system architecture</text><rect x="40" y="80" width="1120" height="120" rx="14" fill="#eef4f8" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="108" font-size="16" font-weight="700" fill="#2a2118">Browser (Next.js client components)</text><text x="56" y="132" font-size="13.5" fill="#6b5a48">Discover · Product · My list · Rankings · Profile pages</text><text x="56" y="152" font-size="13.5" fill="#6b5a48">ScoreFlow / RankFlow comparison sheets · anonymous visitors can browse everything public</text><text x="56" y="172" font-size="13.5" fill="#6b5a48">ApiStore (src/lib/data/api-store.ts): fetch() with the httpOnly session cookie, same-origin only</text><line x1="600" y1="200" x2="600" y2="250" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><text x="608.0" y="219.0" font-size="13" fill="#b8402b" font-weight="600">JSON / multipart over HTTPS</text><rect x="40" y="250" width="1120" height="140" rx="14" fill="#fdf4e3" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="278" font-size="16" font-weight="700" fill="#2a2118">Next.js route handlers (src/app/api/**/route.ts)</text><text x="56" y="302" font-size="13.5" fill="#6b5a48">handler(): JSON errors · same-origin Origin check on every write (CSRF)</text><text x="56" y="322" font-size="13.5" fill="#6b5a48">Input validation (str, oneOf, sizes) · public GETs work with or without a session</text><text x="56" y="342" font-size="13.5" fill="#6b5a48">/auth/*  /products/*  /discover  /feed  /me/*  /collections/*  /users/*  /comments/*  /media/:id</text><line x1="330" y1="390" x2="330" y2="440" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><text x="338.0" y="409.0" font-size="13" fill="#b8402b" font-weight="600">getViewer / requireViewer</text><line x1="860" y1="390" x2="860" y2="440" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><text x="868.0" y="409.0" font-size="13" fill="#b8402b" font-weight="600">repo functions(viewer, …)</text><rect x="40" y="440" width="520" height="150" rx="14" fill="#fcefe8" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="468" font-size="16" font-weight="700" fill="#2a2118">Auth (src/server/auth.ts, password.ts)</text><text x="56" y="492" font-size="13.5" fill="#6b5a48">scrypt password hash: algorithm$salt$hexdigest</text><text x="56" y="512" font-size="13.5" fill="#6b5a48">Session token → SHA-256 stored in sessions</text><text x="56" y="532" font-size="13.5" fill="#6b5a48">30-day httpOnly SameSite=Lax cookie</text><text x="56" y="552" font-size="13.5" fill="#6b5a48">Login throttle · constant-time verify</text><rect x="600" y="440" width="560" height="150" rx="14" fill="#fcefe8" stroke="#d9c9b0" stroke-width="1.5"/><text x="616" y="468" font-size="16" font-weight="700" fill="#2a2118">Repository (src/server/repo.ts)</text><text x="616" y="492" font-size="13.5" fill="#6b5a48">Privacy rules in one place (SQLite has no RLS)</text><text x="616" y="512" font-size="13.5" fill="#6b5a48">Owner-only: tracking, notes, tiers, comparisons</text><text x="616" y="532" font-size="13.5" fill="#6b5a48">Public-or-owner: collections, reviews, media</text><text x="616" y="552" font-size="13.5" fill="#6b5a48">Scores derived on read (src/lib/scores.ts)</text><line x1="300" y1="590" x2="300" y2="640" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><line x1="880" y1="590" x2="880" y2="640" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="640" width="1120" height="90" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="668" font-size="16" font-weight="700" fill="#2a2118">Storage</text><text x="56" y="692" font-size="13.5" fill="#6b5a48">SQLite via node:sqlite → data/sapor.db (migrations in db/migrations, catalog seeded from src/data/catalog.json)</text><text x="56" y="712" font-size="13.5" fill="#6b5a48">Uploaded photos → data/uploads/&lt;user&gt;/&lt;uuid&gt;.&lt;ext&gt; (signature-checked JPEG/PNG/WebP, served via /api/media/:id)</text></svg>