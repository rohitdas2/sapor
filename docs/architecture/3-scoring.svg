<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8402b"/></marker></defs><rect width="1200" height="700" fill="#fffdf9"/><text x="28" y="44" font-size="24" font-weight="700" fill="#2a2118">From “Tried” to a 1–10 score</text><rect x="40" y="90" width="250" height="150" rx="14" fill="#eef4f8" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="118" font-size="16" font-weight="700" fill="#2a2118">1. Mark tried</text><text x="56" y="142" font-size="13.5" fill="#6b5a48">Want to try / Tried</text><text x="56" y="162" font-size="13.5" fill="#6b5a48">on any product card</text><text x="56" y="182" font-size="13.5" fill="#6b5a48">(sign-in required)</text><rect x="330" y="90" width="250" height="150" rx="14" fill="#eef4f8" stroke="#d9c9b0" stroke-width="1.5"/><text x="346" y="118" font-size="16" font-weight="700" fill="#2a2118">2. Pick a tier</text><text x="346" y="142" font-size="13.5" fill="#6b5a48">Loved it   → 7.0–10.0</text><text x="346" y="162" font-size="13.5" fill="#6b5a48">It was fine → 4.0–6.9</text><text x="346" y="182" font-size="13.5" fill="#6b5a48">Didn&#x27;t like → 1.0–3.9</text><rect x="620" y="90" width="250" height="150" rx="14" fill="#fdf4e3" stroke="#d9c9b0" stroke-width="1.5"/><text x="636" y="118" font-size="16" font-weight="700" fill="#2a2118">3. Compare</text><text x="636" y="142" font-size="13.5" fill="#6b5a48">“Which did you prefer?”</text><text x="636" y="162" font-size="13.5" fill="#6b5a48">binary insertion over tier</text><text x="636" y="182" font-size="13.5" fill="#6b5a48">≈ log2(n) questions</text><text x="636" y="202" font-size="13.5" fill="#6b5a48">same = tie · unsure = skip</text><rect x="910" y="90" width="250" height="150" rx="14" fill="#fcefe8" stroke="#d9c9b0" stroke-width="1.5"/><text x="926" y="118" font-size="16" font-weight="700" fill="#2a2118">4. Confirm</text><text x="926" y="142" font-size="13.5" fill="#6b5a48">preview position + score</text><text x="926" y="162" font-size="13.5" fill="#6b5a48">Looks right / Compare again</text><text x="926" y="182" font-size="13.5" fill="#6b5a48">PUT /api/me/tiers/:tier</text><text x="926" y="202" font-size="13.5" fill="#6b5a48">atomic order replace</text><line x1="290" y1="165" x2="330" y2="165" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><line x1="580" y1="165" x2="620" y2="165" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><line x1="870" y1="165" x2="910" y2="165" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="290" width="540" height="200" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="318" font-size="16" font-weight="700" fill="#2a2118">Stored (source of truth)</text><text x="56" y="342" font-size="13.5" fill="#6b5a48">user_products: tier, tier_position, tied_with_prev</text><text x="56" y="362" font-size="13.5" fill="#6b5a48">comparisons: every answer (product, other, result,</text><text x="56" y="382" font-size="13.5" fill="#6b5a48">   collection_id NULL = overall taste ranking)</text><text x="56" y="402" font-size="13.5" fill="#6b5a48">Scores are never stored, so they can&#x27;t drift</text><text x="56" y="422" font-size="13.5" fill="#6b5a48">   from the confirmed order</text><rect x="620" y="290" width="540" height="200" rx="14" fill="#fcefe8" stroke="#d9c9b0" stroke-width="1.5"/><text x="636" y="318" font-size="16" font-weight="700" fill="#2a2118">Derived on read (src/lib/scores.ts)</text><text x="636" y="342" font-size="13.5" fill="#6b5a48">groups = tie groups in the tier, best first</text><text x="636" y="362" font-size="13.5" fill="#6b5a48">score = lo + (hi − lo) × (G − g) / (G + 1)</text><text x="636" y="382" font-size="13.5" fill="#6b5a48">1 item loved → 8.5 · 2 items → 9.0 and 8.0</text><text x="636" y="402" font-size="13.5" fill="#6b5a48">ties share a score · rounded to one decimal</text><text x="636" y="422" font-size="13.5" fill="#6b5a48">community average = only users with Share my scores</text><line x1="580" y1="390" x2="620" y2="390" stroke="#b8402b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="540" width="1120" height="120" rx="14" fill="#fdf4e3" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="568" font-size="16" font-weight="700" fill="#2a2118">Curated rankings use the same comparison engine</text><text x="56" y="592" font-size="13.5" fill="#6b5a48">collections + collection_items(position, tied_with_prev; NULL position = waiting to be placed)</text><text x="56" y="612" font-size="13.5" fill="#6b5a48">Each ranking is independent: reordering one never touches another or your scores. Drag, arrows and “=” ties for hand edits.</text><text x="56" y="632" font-size="13.5" fill="#6b5a48">Community favorites = products in the top 3 of public rankings from at least two people.</text></svg>