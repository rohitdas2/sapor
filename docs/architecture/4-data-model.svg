<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8402b"/></marker></defs><rect width="1200" height="860" fill="#fffdf9"/><text x="28" y="44" font-size="24" font-weight="700" fill="#2a2118">Data model (db/migrations/001_init.sql)</text><rect x="40" y="80" width="270" height="98" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="108" font-size="16" font-weight="700" fill="#2a2118">users</text><text x="56" y="132" font-size="13.5" fill="#6b5a48">id · email · password</text><text x="56" y="152" font-size="13.5" fill="#6b5a48">role (user|admin)</text><rect x="40" y="230" width="270" height="98" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="258" font-size="16" font-weight="700" fill="#2a2118">sessions</text><text x="56" y="282" font-size="13.5" fill="#6b5a48">id = sha256(token)</text><text x="56" y="302" font-size="13.5" fill="#6b5a48">user_id · expires_at</text><rect x="40" y="380" width="270" height="142" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="56" y="408" font-size="16" font-weight="700" fill="#2a2118">profiles</text><text x="56" y="432" font-size="13.5" fill="#6b5a48">user_id · display_name · bio</text><text x="56" y="452" font-size="13.5" fill="#6b5a48">avatar_media_id</text><text x="56" y="472" font-size="13.5" fill="#6b5a48">pinned_collection_id</text><text x="56" y="492" font-size="13.5" fill="#6b5a48">share_scores</text><rect x="345" y="80" width="290" height="142" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="361" y="108" font-size="16" font-weight="700" fill="#2a2118">products</text><text x="361" y="132" font-size="13.5" fill="#6b5a48">id · retailer_id · slug</text><text x="361" y="152" font-size="13.5" fill="#6b5a48">category · description</text><text x="361" y="172" font-size="13.5" fill="#6b5a48">emoji · photo_* · instagram_url</text><text x="361" y="192" font-size="13.5" fill="#6b5a48">availability</text><rect x="345" y="265" width="290" height="142" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="361" y="293" font-size="16" font-weight="700" fill="#2a2118">user_products (private)</text><text x="361" y="317" font-size="13.5" fill="#6b5a48">user_id · product_id · status</text><text x="361" y="337" font-size="13.5" fill="#6b5a48">notes · first_tried_on</text><text x="361" y="357" font-size="13.5" fill="#6b5a48">tier · tier_position</text><text x="361" y="377" font-size="13.5" fill="#6b5a48">tied_with_prev</text><rect x="345" y="450" width="290" height="120" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="361" y="478" font-size="16" font-weight="700" fill="#2a2118">comparisons (private)</text><text x="361" y="502" font-size="13.5" fill="#6b5a48">user_id · collection_id?</text><text x="361" y="522" font-size="13.5" fill="#6b5a48">product_id · other_product_id</text><text x="361" y="542" font-size="13.5" fill="#6b5a48">result</text><rect x="660" y="80" width="250" height="98" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="676" y="108" font-size="16" font-weight="700" fill="#2a2118">collections</text><text x="676" y="132" font-size="13.5" fill="#6b5a48">id · owner_id · title</text><text x="676" y="152" font-size="13.5" fill="#6b5a48">visibility (private|public)</text><rect x="660" y="230" width="250" height="98" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="676" y="258" font-size="16" font-weight="700" fill="#2a2118">collection_items</text><text x="676" y="282" font-size="13.5" fill="#6b5a48">collection_id · product_id</text><text x="676" y="302" font-size="13.5" fill="#6b5a48">position? · tied_with_prev</text><rect x="660" y="380" width="250" height="142" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="676" y="408" font-size="16" font-weight="700" fill="#2a2118">comments</text><text x="676" y="432" font-size="13.5" fill="#6b5a48">target_type: product|post|</text><text x="676" y="452" font-size="13.5" fill="#6b5a48">   collection · target_id</text><text x="676" y="472" font-size="13.5" fill="#6b5a48">parent_id (threads)</text><text x="676" y="492" font-size="13.5" fill="#6b5a48">deleted_at (soft)</text><rect x="935" y="80" width="225" height="164" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="951" y="108" font-size="16" font-weight="700" fill="#2a2118">posts</text><text x="951" y="132" font-size="13.5" fill="#6b5a48">kind: review | hack |</text><text x="951" y="152" font-size="13.5" fill="#6b5a48">   post | video</text><text x="951" y="172" font-size="13.5" fill="#6b5a48">author_id · product_id?</text><text x="951" y="192" font-size="13.5" fill="#6b5a48">title · body · visibility</text><text x="951" y="212" font-size="13.5" fill="#6b5a48">deleted_at</text><rect x="935" y="290" width="225" height="98" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="951" y="318" font-size="16" font-weight="700" fill="#2a2118">post_products</text><text x="951" y="342" font-size="13.5" fill="#6b5a48">post_id · product_id</text><text x="951" y="362" font-size="13.5" fill="#6b5a48">(multi-product hacks)</text><rect x="935" y="420" width="225" height="142" rx="14" fill="#eef6f0" stroke="#d9c9b0" stroke-width="1.5"/><text x="951" y="448" font-size="16" font-weight="700" fill="#2a2118">post_media → media</text><text x="951" y="472" font-size="13.5" fill="#6b5a48">media: image | video</text><text x="951" y="492" font-size="13.5" fill="#6b5a48">mime · bytes · storage_key</text><text x="951" y="512" font-size="13.5" fill="#6b5a48">duration_ms · poster</text><text x="951" y="532" font-size="13.5" fill="#6b5a48">status: ready|processing</text><rect x="40" y="640" width="270" height="76" rx="14" fill="#f4f1ec" stroke="#d9c9b0" stroke-width="1.5" stroke-dasharray="7 5"/><text x="56" y="668" font-size="16" font-weight="700" fill="#2a2118">reactions (future)</text><text x="56" y="692" font-size="13.5" fill="#6b5a48">user · target · kind=like</text><rect x="345" y="640" width="290" height="76" rx="14" fill="#f4f1ec" stroke="#d9c9b0" stroke-width="1.5" stroke-dasharray="7 5"/><text x="361" y="668" font-size="16" font-weight="700" fill="#2a2118">follows (future)</text><text x="361" y="692" font-size="13.5" fill="#6b5a48">follower_id · followee_id</text><rect x="660" y="640" width="250" height="76" rx="14" fill="#f4f1ec" stroke="#d9c9b0" stroke-width="1.5" stroke-dasharray="7 5"/><text x="676" y="668" font-size="16" font-weight="700" fill="#2a2118">reports (future)</text><text x="676" y="692" font-size="13.5" fill="#6b5a48">reporter · target · reason</text><text x="935" y="670" font-size="13.5" fill="#2a2118" font-weight="400">Built today: reviews (posts.kind=</text><text x="935" y="690" font-size="13.5" fill="#2a2118" font-weight="400">review), product comments, photos.</text><text x="935" y="715" font-size="13.5" fill="#2a2118" font-weight="400">Dashed tables and hack/post/video</text><text x="935" y="735" font-size="13.5" fill="#2a2118" font-weight="400">kinds are schema-only for now.</text><text x="40" y="830" font-size="13.5" fill="#2a2118" font-weight="400">Every user-owned table cascades on user delete. Reviews are unique per (author, product) via a partial index on posts.</text></svg>